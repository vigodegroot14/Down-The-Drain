<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <g stroke="#10225b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail and rounded floating body. -->
    <path fill="#ffd84d" d="M70 119C47 121 29 111 17 94c-4 27 8 47 30 57 12 31 53 49 105 49 60 0 103-25 109-63-21 2-37-4-52-17-20-18-47-27-78-25-25 1-46 9-61 24Z"/>
    <!-- Head and short neck sit clearly above the body. -->
    <path fill="#ffd84d" d="M178 125c8-12 15-24 15-38a49 49 0 1 1 87 31c-11 14-28 22-47 20-19-2-38-7-55-13Z"/>
    <!-- Orange beak projects from the face. -->
    <path fill="#ff7a00" d="M271 75h25c13 0 19 15 10 24l-13 12-29-12c-10-4-12-18-3-23 3-1 6-1 10-1Z"/>
    <!-- Eye and glossy highlight. -->
    <circle cx="237" cy="65" r="8" fill="#10225b" stroke="none"/>
    <circle cx="240" cy="62" r="2.5" fill="#f6f8ff" stroke="none"/>
    <!-- The wing reads as a separate feathered shape. -->
    <path fill="#f4b900" d="M91 143c23-24 67-27 95-5-8 28-38 44-67 33-15-5-25-15-28-28Z"/>
    <path fill="none" d="M112 145c15-8 33-8 48 0"/>
    <!-- Water ripples anchor the duck. -->
    <path fill="none" d="M24 215c22-10 44-10 66 0s44 10 66 0 44-10 66 0 44 10 74-1"/>
  </g>
</svg>
